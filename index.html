<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏊‍♀️ Swimmer Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg:#06080f; --panel:#0d1117; --card:#161b22; --border:#21262d;
    --accent:#58a6ff; --green:#3fb950; --red:#f85149; --orange:#e3b341;
    --purple:#bc8cff; --teal:#39d353; --muted:#8b949e; --text:#e6edf3;
    --subtle:#30363d; --gold:#e3b341; --mono:'DM Mono',monospace;
    --sans:'Space Grotesk',sans-serif;
  }
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh}
  ::-webkit-scrollbar{width:5px;height:5px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:var(--subtle);border-radius:3px}
  input,select,textarea{font-family:var(--mono);color:var(--text);background:var(--card);
    border:1px solid var(--border);border-radius:6px;outline:none;transition:border-color .15s}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  button{cursor:pointer;font-family:var(--mono);transition:all .15s}
  table{border-collapse:collapse;width:100%}
  th,td{text-align:left;vertical-align:middle}

  /* ── Login ── */
  #login-screen{position:fixed;inset:0;background:var(--bg);display:flex;
    align-items:center;justify-content:center;z-index:9999;
    background-image:radial-gradient(ellipse at 20% 20%,#1e3a5f22,transparent 60%),
                     radial-gradient(ellipse at 80% 80%,#1a3a2022,transparent 60%)}
  .login-box{background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:40px;width:360px;max-width:90vw;text-align:center}
  .login-logo{font-size:48px;margin-bottom:8px}
  .login-title{font-size:22px;font-weight:800;color:var(--accent);margin-bottom:4px}
  .login-sub{font-size:12px;color:var(--muted);margin-bottom:28px}
  .login-input{width:100%;padding:11px 14px;font-size:14px;margin-bottom:12px;
    border-radius:8px;background:var(--panel)}
  .login-btn{width:100%;padding:11px;font-size:14px;font-weight:700;
    background:var(--accent);color:#000;border:none;border-radius:8px;margin-bottom:8px}
  .login-btn:hover{opacity:.9}
  .login-err{color:var(--red);font-size:12px;min-height:18px;font-family:var(--mono)}

  /* ── Layout ── */
  #app{display:none;min-height:100vh}
  .header{background:var(--panel);border-bottom:1px solid var(--border);
    padding:0 20px;position:sticky;top:0;z-index:100;height:54px;
    display:flex;align-items:center;gap:16px}
  .header-logo{font-size:18px;font-weight:800;color:var(--accent);white-space:nowrap}
  .header-sub{font-size:10px;color:var(--muted);white-space:nowrap}
  .nav{display:flex;gap:2px;flex:1;overflow-x:auto}
  .nav-btn{padding:6px 12px;border-radius:6px;border:none;font-size:11px;font-weight:600;
    background:transparent;color:var(--muted);white-space:nowrap}
  .nav-btn.active{background:var(--accent)22;color:var(--accent)}
  .nav-btn:hover:not(.active){color:var(--text)}
  .header-actions{display:flex;gap:6px;flex-shrink:0}
  .main{max-width:1200px;margin:0 auto;padding:20px}

  /* ── Cards & Sections ── */
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
  .section-hdr{display:flex;justify-content:space-between;align-items:flex-end;
    margin-bottom:14px;border-left:4px solid var(--accent);padding-left:10px}
  .section-hdr h3{font-size:13px;font-weight:800;color:var(--accent);letter-spacing:.4px}
  .section-hdr p{font-size:10px;color:var(--muted);margin-top:2px}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:20px}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;
    padding:12px 14px;border-top:3px solid var(--accent)}
  .stat-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-family:var(--mono)}
  .stat-value{font-size:20px;font-weight:800;color:var(--accent);margin:3px 0 2px}
  .stat-sub{font-size:10px;color:var(--muted)}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

  /* ── Pill ── */
  .pill{display:inline-flex;align-items:center;border-radius:20px;padding:2px 9px;
    font-size:10px;font-weight:700;font-family:var(--mono);white-space:nowrap;border:1px solid transparent}

  /* ── Table ── */
  .tbl th{padding:7px 10px;font-size:9px;color:var(--muted);text-transform:uppercase;
    border-bottom:1px solid var(--border);font-family:var(--mono);white-space:nowrap;letter-spacing:.4px}
  .tbl td{padding:7px 10px;font-size:11px;border-bottom:1px solid var(--border)14}
  .tbl tr:nth-child(even) td{background:var(--panel)55}
  .mono{font-family:var(--mono)}

  /* ── Buttons ── */
  .btn{padding:7px 14px;border-radius:6px;font-size:11px;font-weight:700;
    border:1px solid transparent;font-family:var(--mono)}
  .btn-primary{background:var(--accent)22;color:var(--accent);border-color:var(--accent)44}
  .btn-primary:hover{background:var(--accent)33}
  .btn-green{background:var(--green)22;color:var(--green);border-color:var(--green)44}
  .btn-green:hover{background:var(--green)33}
  .btn-red{background:var(--red)22;color:var(--red);border-color:var(--red)44}
  .btn-red:hover{background:var(--red)33}
  .btn-outline{background:transparent;color:var(--muted);border-color:var(--border)}
  .btn-outline:hover{color:var(--text);border-color:var(--subtle)}
  .btn-sm{padding:4px 10px;font-size:10px}
  .btn-purple{background:var(--purple)22;color:var(--purple);border-color:var(--purple)44}
  .btn-orange{background:var(--orange)22;color:var(--orange);border-color:var(--orange)44}

  /* ── Forms ── */
  .form-group{display:flex;flex-direction:column;gap:4px}
  .form-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-family:var(--mono)}
  .form-input{padding:8px 10px;font-size:12px;width:100%}
  .form-input-sm{padding:5px 7px;font-size:11px}

  /* ── Modal ── */
  .modal-overlay{position:fixed;inset:0;background:#000000cc;z-index:500;
    display:flex;align-items:center;justify-content:center;padding:16px}
  .modal-box{background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:24px;width:100%;max-height:92vh;overflow-y:auto}
  .modal-title{font-size:16px;font-weight:800;margin-bottom:18px}
  .modal-close{float:right;background:none;border:none;color:var(--muted);
    font-size:20px;line-height:1;padding:0 4px}
  .modal-close:hover{color:var(--text)}
  .modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}

  /* ── Session accordion ── */
  .session-item{background:var(--card);border:1px solid var(--border);border-radius:12px;
    overflow:hidden;margin-bottom:10px}
  .session-hdr{padding:12px 16px;cursor:pointer;display:flex;justify-content:space-between;
    align-items:center;gap:10px;flex-wrap:wrap}
  .session-hdr:hover{background:var(--panel)}
  .session-body{padding:0 16px 16px;display:none}
  .session-body.open{display:block}

  /* ── Toast ── */
  .toast{position:fixed;bottom:20px;right:20px;z-index:999;background:var(--card);
    border:1px solid var(--green);border-radius:8px;padding:10px 16px;
    color:var(--green);font-family:var(--mono);font-size:12px;font-weight:700;
    box-shadow:0 8px 24px #3fb95033;animation:slideUp .2s ease}
  .toast.err{border-color:var(--red);color:var(--red);box-shadow:0 8px 24px #f8514933}
  @keyframes slideUp{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  /* ── Rep table mini inputs ── */
  .rep-inp{width:52px;padding:4px 5px;font-size:11px;text-align:center}
  .rep-inp-time{width:66px}
  .rep-inp-note{width:120px;text-align:left}

  /* ── Chart containers ── */
  .chart-wrap{position:relative;height:200px}

  /* ── Responsive ── */
  @media(max-width:680px){
    .grid-2{grid-template-columns:1fr}
    .grid-3{grid-template-columns:1fr 1fr}
    .header{padding:0 12px}
    .main{padding:12px}
  }
  @media(max-width:400px){
    .grid-3{grid-template-columns:1fr}
    .nav-btn{padding:5px 8px;font-size:10px}
  }
</style>
</head>
<body>

<!-- ════════════════════════ LOGIN ════════════════════════ -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">🏊‍♀️</div>
    <div class="login-title">Swimmer Tracker</div>
    <div class="login-sub">Maryland LSC · Private Family App</div>
    <input class="login-input" type="password" id="pw-input" placeholder="Enter password"
      onkeydown="if(event.key==='Enter')tryLogin()">
    <button class="login-btn" onclick="tryLogin()">Enter</button>
    <div class="login-err" id="login-err"></div>
    <div style="margin-top:16px;font-size:10px;color:var(--muted)">
      Default password: <span style="font-family:var(--mono);color:var(--accent)">swimmer2026</span><br>
      Change it in Settings after logging in
    </div>
  </div>
</div>

<!-- ════════════════════════ APP ════════════════════════ -->
<div id="app">

  <!-- Header -->
  <div class="header">
    <div>
      <div class="header-logo">🏊‍♀️ <span id="hdr-name">Swimmer</span></div>
      <div class="header-sub" id="hdr-sub">Maryland LSC · Age 11</div>
    </div>
    <nav class="nav">
      <button class="nav-btn active" onclick="showTab('dashboard')">Dashboard</button>
      <button class="nav-btn" onclick="showTab('sessions')">Training Log</button>
      <button class="nav-btn" onclick="showTab('meets')">Meet Results</button>
      <button class="nav-btn" onclick="showTab('strokes')">Stroke Counts</button>
      <button class="nav-btn" onclick="showTab('bests')">Season Bests</button>
      <button class="nav-btn" onclick="showTab('standards')">Standards</button>
      <button class="nav-btn" onclick="showTab('settings')">Settings</button>
    </nav>
    <div class="header-actions">
      <button class="btn btn-green btn-sm" onclick="openAddModal()">+ Add</button>
      <button class="btn btn-outline btn-sm" onclick="exportData()">Export</button>
      <button class="btn btn-outline btn-sm" onclick="document.getElementById('import-file').click()">Import</button>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
      <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
    </div>
  </div>

  <!-- Tab content -->
  <div class="main">
    <div id="tab-dashboard"></div>
    <div id="tab-sessions" style="display:none"></div>
    <div id="tab-meets" style="display:none"></div>
    <div id="tab-strokes" style="display:none"></div>
    <div id="tab-bests" style="display:none"></div>
    <div id="tab-standards" style="display:none"></div>
    <div id="tab-settings" style="display:none"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast" style="display:none"></div>

<!-- Modals -->
<div id="modal-overlay" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal-box" id="modal-box" style="max-width:520px"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// DATA & CONSTANTS
// ═══════════════════════════════════════════════════════════════
const STORAGE_KEY = 'swimtracker_v2';
const DEFAULT_PW  = 'swimmer2026';

// ── VERIFIED QUALIFYING STANDARDS — 2026 Maryland Swimming ────────────────────
// Source: Official 2026 Speedo Maryland Jr Champs Sites 1 & 2 PDFs (SCY)
// Source: 2026 Maryland State LC Junior Championships PDF (LCM)
// Source: 2026 Speedo Maryland LC Championship meet info PDF (LCM single cut)
//
// SC Jr Champs (SCY) — Dual band. Must be BETWEEN top cut and bottom cut.
// Top cut = faster than this means Senior/14U level. Bottom cut = entry standard.
//
// 9-10 Girls SC Jr Champs
const SC10_TOP = {fr50:'31.59',fr100:'1:10.89',bk50:'37.19',bk100:'1:20.59',br50:'36.09',br100:'1:33.39',fl50:'36.09',im200:'2:55.99'};
const SC10_BOT = {fr50:'37.99',fr100:'1:23.09',bk50:'45.29',bk100:'1:35.99',br50:'44.69',br100:'1:48.89',fl50:'44.69',im200:'3:18.79'};
// 11-12 Girls SC Jr Champs
const SC11_TOP = {fr50:'28.19',fr100:'1:01.19',bk50:'32.59',bk100:'1:09.89',br50:'30.99',br100:'1:19.99',fl50:'30.99',im200:'2:31.39'};
const SC11_BOT = {fr50:'33.69',fr100:'1:11.39',bk50:'37.99',bk100:'1:21.79',br50:'36.29',br100:'1:31.29',fl50:'36.29',im200:'2:50.69'};

// LC Jr Champs (LCM) — Dual band. Must be BETWEEN top cut and bottom cut.
// 9-10 Girls LC Jr Champs
const LC10_TOP = {fr50:'35.19',fr100:'1:21.19',fr200:'2:57.49',bk50:'43.39',bk100:'1:33.09',br50:'48.09',br100:'1:46.49',fl50:'41.49',im200:'3:17.59',fr400:'6:05.89'};
const LC10_BOT = {fr50:'45.29',fr100:'1:44.09',fr200:'3:50.99',bk50:'55.79',bk100:'2:01.59',br50:'1:02.19',br100:'2:19.39',fl50:'54.49',im200:'4:15.69',fr400:'7:48.59'};
// 11-12 Girls LC Jr Champs
const LC11_TOP = {fr50:'31.69',fr100:'1:10.09',fr200:'2:32.39',bk50:'37.19',bk100:'1:20.79',br50:'41.99',br100:'1:32.79',fl50:'34.99',im200:'2:51.69',fr400:'5:23.29'};
const LC11_BOT = {fr50:'38.49',fr100:'1:21.79',fr200:'3:00.59',bk50:'44.89',bk100:'1:37.19',br50:'52.09',br100:'1:52.49',fl50:'41.99',im200:'3:18.79',fr400:'6:52.19'};

// MD LC Champs (LCM) — Single top cut. Swim faster = qualifies.
const LC_CHAMPS_10 = {fr50:'35.19',fr100:'1:21.19',fr200:'2:57.49',bk50:'43.39',bk100:'1:33.09',br50:'48.09',br100:'1:46.49',fl50:'41.49',fl100:'1:36.79',im200:'3:17.59',fr400:'6:05.89'};
const LC_CHAMPS_11 = {fr50:'31.69',fr100:'1:10.09',fr200:'2:32.39',bk50:'37.19',bk100:'1:20.79',br50:'41.99',br100:'1:32.79',fl50:'34.99',fl100:'1:21.89',im200:'2:51.69',fr400:'5:23.29'};

// Keep legacy alias for Standards page compatibility
const LC_CHAMPS = LC_CHAMPS_10;
// Legacy aliases — Standards page uses these; SC Jr Champs used to be stored here
// These now correctly point to SC 9-10 Jr Champs
const JR_TOP = SC10_TOP;
const JR_BOT = SC10_BOT;
const JR11_TOP = SC11_TOP;
const JR11_BOT = SC11_BOT;

const SC_TO_LC = {fr50:1.130,fr100:1.107,fr200:1.078,bk50:1.130,bk100:1.107,br50:1.130,br100:1.107,fl50:1.130,fl100:1.107,im200:1.078,fr400:1.055};

// ── Utils — defined early so everything below can use them ────────────────────
const toSec = t => {
  if (!t || t === '—') return null;
  const s = String(t);
  if (s.includes(':')) { const [m, sec] = s.split(':'); return parseFloat(m)*60+parseFloat(sec); }
  return parseFloat(s);
};
const fmtSec = s => {
  if (s === null || s === undefined || isNaN(s)) return '—';
  if (s >= 60) { const m=Math.floor(s/60); const sec=(s%60).toFixed(2).padStart(5,'0'); return `${m}:${sec}`; }
  return parseFloat(s).toFixed(2);
};
const uid = () => Date.now() + Math.floor(Math.random()*1000);
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const pill = (text, color, extra='') =>
  `<span class="pill" style="background:${color}22;color:${color};border-color:${color}44;${extra}">${esc(text)}</span>`;

// ── Set & stroke configuration ────────────────────────────────────────────────
const SET_TYPES = {
  '6x100':  { reps:6,  legs:4,  dist:100, label:'6 × 100' },
  '4x150':  { reps:4,  legs:6,  dist:150, label:'4 × 150' },
  '5x150':  { reps:5,  legs:6,  dist:150, label:'5 × 150' },
  '4x200':  { reps:4,  legs:8,  dist:200, label:'4 × 200' },
  '5x200':  { reps:5,  legs:8,  dist:200, label:'5 × 200' },
  '8x75':   { reps:8,  legs:3,  dist:75,  label:'8 × 75'  },
  '10x50':  { reps:10, legs:2,  dist:50,  label:'10 × 50' },
  'custom': { reps:6,  legs:4,  dist:100, label:'Custom'  },
};

const STROKE_EVENTS = [
  { key:'50',  label:'50',  legs25:2,  legs50:1 },
  { key:'100', label:'100', legs25:4,  legs50:2 },
  { key:'150', label:'150', legs25:6,  legs50:3 },
  { key:'200', label:'200', legs25:8,  legs50:4 },
  { key:'400', label:'400', legs25:16, legs50:8 },
];

function getNumLegs(eventKey, pool) {
  const ev = STROKE_EVENTS.find(e=>e.key===eventKey) || STROKE_EVENTS[1];
  return pool==='50m' ? ev.legs50 : ev.legs25;
}

function buildStrokeInputs(prefix, color, label, numLegs, existing={}) {
  const inputs = Array.from({length:numLegs},(_,i)=>{
    const k=`l${i+1}`;
    const v=existing[k]!=null?existing[k]:'';
    return `<div class="form-group" style="flex-shrink:0">
      <label class="form-label">L${i+1}</label>
      <input class="form-input" id="${prefix}-l${i+1}" value="${v}"
        style="width:46px;padding:5px 4px;text-align:center;font-family:var(--mono)">
    </div>`;
  }).join('');
  return `
    <div style="margin-bottom:14px">
      <div style="font-size:11px;font-weight:700;color:${color};margin-bottom:6px;
        font-family:var(--mono);display:flex;align-items:center;gap:8px">
        ${label}
        <span style="font-size:9px;color:var(--muted);font-weight:400">${numLegs} length${numLegs!==1?'s':''}</span>
      </div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:flex-end">
        ${inputs}
        <div class="form-group" style="flex:1;min-width:100px">
          <label class="form-label">Notes</label>
          <input class="form-input" id="${prefix}-notes" value="${esc(existing.notes||'')}">
        </div>
      </div>
    </div>`;
}

const EVENTS = [
  {key:'fr50', label:'50 Free',    color:'#38bdf8'},
  {key:'fr100',label:'100 Free',   color:'#0ea5e9'},
  {key:'fr200',label:'200 Free',   color:'#0284c7'},
  {key:'bk50', label:'50 Back',    color:'#818cf8'},
  {key:'bk100',label:'100 Back',   color:'#6366f1'},
  {key:'br50', label:'50 Breast',  color:'#22c55e'},
  {key:'br100',label:'100 Breast', color:'#16a34a'},
  {key:'fl50', label:'50 Fly',     color:'#fb923c'},
  {key:'fl100',label:'100 Fly',    color:'#ea580c'},
  {key:'im100',label:'100 IM',     color:'#f472b6'},
  {key:'im200',label:'200 IM',     color:'#ec4899'},
];

const DEFAULT_DATA = {
  password: DEFAULT_PW,
  athlete:  {name:'Swimmer', age:11, club:'Maryland LSC'},
  scBests: {
    fr50: {time:'34.50',  date:'2025-03',meet:'Jr Champs 2025',notes:'Season best'},
    fr100:{time:'1:21.70',date:'2025-03',meet:'Jr Champs 2025',notes:''},
    fr200:{time:'',date:'',meet:'',notes:'No SCY 200 baseline'},
    bk50: {time:'40.90',  date:'2025-03',meet:'Jr Champs 2025',notes:'PR −2.03s'},
    bk100:{time:'1:29.63',date:'2025-03',meet:'Jr Champs 2025',notes:''},
    br50: {time:'47.09',  date:'2025-03',meet:'Jr Champs 2025',notes:'PR −1.19s'},
    br100:{time:'1:41.78',date:'2025-03',meet:'Jr Champs 2025',notes:'PR −3.36s'},
    fl50: {time:'44.84',  date:'2025-03',meet:'Jr Champs 2025',notes:''},
    im100:{time:'1:40.42',date:'2025-03',meet:'Jr Champs 2025',notes:''},
    im200:{time:'3:31.19',date:'2025-03',meet:'Jr Champs 2025',notes:'First attempt'},
  },
  lcBests: {
    fr50: {time:'42.26',  date:'2025-07',meet:'LC July 2025',notes:''},
    fr100:{time:'1:38.17',date:'2025-07',meet:'LC July 2025',notes:'Split: 44.61/53.56'},
    fr200:{time:'3:43.20',date:'2025-07',meet:'LC July 2025',notes:''},
    bk100:{time:'1:46.26',date:'2025-07',meet:'LC July 2025',notes:''},
    br50: {time:'59.67',  date:'2025-07',meet:'LC July 2025',notes:''},
    fl50: {time:'58.22',  date:'2025-07',meet:'LC July 2025',notes:''},
  },
  sessions: [

// ── jrStatus, getPredLC — depend on utils above ───────────────────────────────
const jrStatus = (pred, key) => {
  if (!pred || !JR_TOP[key] || !JR_BOT[key]) return null;
  const p=toSec(pred), t=toSec(JR_TOP[key]), b=toSec(JR_BOT[key]);
  if (p<=t) return {text:'Sr cut',color:'#818cf8'};
  if (p<=b) return {text:'✓ Jr Qual',color:'#3fb950'};
  return {text:`+${(p-b).toFixed(2)}s needed`,color:'#e3b341'};
};

const getPredLC = key => {
  const rec = DB?.scBests?.[key];
  if (!rec?.time || !SC_TO_LC[key]) return null;
  return fmtSec((toSec(rec.time)||0) * SC_TO_LC[key]);
};

const swingColor = s => s===0?'var(--teal)':s<=2?'var(--green)':s<=4?'var(--gold)':'var(--red)';
const timeColor = t => toSec(t)<=100?'var(--green)':'var(--text)';
const strokeColor = v => v&&v<=23?'var(--green)':v&&v>=30?'var(--red)':'var(--text)';
const strokeWeight = v => v&&v<=23?'800':'400';

// STORAGE
// ═══════════════════════════════════════════════════════════════
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    DB = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(DEFAULT_DATA));
  } catch { DB = JSON.parse(JSON.stringify(DEFAULT_DATA)); }
  migrateData();
}

// Fix any sessions with large random uid() IDs — renumber them sequentially
// preserving chronological order while keeping any already-small IDs intact
function migrateData() {
  if (!DB.sessions || !DB.sessions.length) return;
  // Find sessions with non-sequential IDs (anything > 10000 is clearly a uid timestamp)
  const hasJunk = DB.sessions.some(s => typeof s.id === 'number' && s.id > 10000);
  if (!hasJunk) return;
  // Sort by date first, then by existing id as tiebreaker, then renumber 1..N
  DB.sessions.sort((a, b) => {
    const dc = (a.date||'').localeCompare(b.date||'');
    if (dc !== 0) return dc;
    return (a.id||0) - (b.id||0);
  });
  DB.sessions.forEach((s, i) => { s.id = i + 1; });
  saveData();
}
function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
}
function exportData() {
  const blob = new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `swimmer-data-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  toast('Data exported ✓');
}
function importData(e) {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      DB = JSON.parse(ev.target.result);
      saveData(); renderAll(); toast('Data imported ✓');
    } catch { toast('Invalid file','err'); }
  };
  r.readAsText(file);
  e.target.value='';
}

function tryLogin() {
  const pw = document.getElementById('pw-input').value;
  loadData();
  if (pw === (DB.password||DEFAULT_PW)) {
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').style.display='block';
    sessionStorage.setItem('auth','1');
    renderAll();
  } else {
    document.getElementById('login-err').textContent='Incorrect password';
    setTimeout(()=>document.getElementById('login-err').textContent='',2000);
  }
}
function logout() {
  sessionStorage.removeItem('auth');
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('pw-input').value='';
}
// Auto-login if session active
window.addEventListener('load',()=>{
  if (sessionStorage.getItem('auth')==='1') {
    loadData();
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').style.display='block';
    renderAll();
  }
});
document.getElementById('pw-input').addEventListener('keydown',e=>{if(e.key==='Enter')tryLogin();});

}

function showTab(name) {
  currentTab=name;
  document.querySelectorAll('.nav-btn').forEach((b,i)=>{
    const tabs=['dashboard','sessions','meets','strokes','bests','standards','settings'];
    b.classList.toggle('active',tabs[i]===name);
  });
  document.querySelectorAll('[id^="tab-"]').forEach(el=>el.style.display='none');
  document.getElementById('tab-'+name).style.display='';
  renderTab(name);
}
function renderAll() {
  // Update header
  if (DB.athlete) {
    document.getElementById('hdr-name').textContent=DB.athlete.name||'Swimmer';
    document.getElementById('hdr-sub').textContent=`${DB.athlete.club||'Maryland LSC'} · Age ${DB.athlete.age||11}`;
  }
  renderTab(currentTab);
}
function renderTab(name) {
  // Destroy existing charts for this tab
  Object.keys(charts).forEach(k=>{if(k.startsWith(name)){try{charts[k].destroy();}catch{}delete charts[k];}});
  const fns={dashboard:renderDashboard,sessions:renderSessions,meets:renderMeets,
    strokes:renderStrokes,bests:renderBests,standards:renderStandards,settings:renderSettings};
  if(fns[name]) fns[name]();
}

  const spreads = sessions.map(s=>{
    const t=(s.reps||[]).map(r=>toSec(r.time)).filter(Boolean);
    return t.length>1?parseFloat((Math.max(...t)-Math.min(...t)).toFixed(1)):null;

  const bestSpread = spreads.length ? Math.min(...spreads).toFixed(1) : '—';

  // Latest L1 counts — per stroke — normalised to 25y equivalent
  // 25m pool counts are ~8.5% higher per length; divide by 1.094 to get 25y equivalent
  const normL1 = (val, pool) => {
    if (val==null) return null;
    return pool==='25m' ? Math.round(val/1.094) : val;
  };

  if (val==null) return null;
  if (pool==='25m') return Math.round(val/1.094);
  return val;
}

    });
  }

  // 2. Stroke count trend — session-by-session freestyle L1, normalised to 25y
  //    Also overlay backstroke best from stroke history
  const frTrend = sessions.map(s=>{
    const l1s=(s.reps||[]).map(r=>r.l1).filter(v=>v!=null);
    return {
      x:`S${s.id}`,
      best: l1s.length ? normToYards(Math.min(...l1s),s.pool) : null,
      avg:  l1s.length ? normToYards(Math.round(l1s.reduce((a,b)=>a+b,0)/l1s.length),s.pool) : null,
    };
  });

  // Backstroke L1 points from stroke history (as a scatter overlay)
  const bkPoints = sh
    .filter(h=>h.backstroke?.l1!=null)
    .map(h=>({x:h.date, y:normToYards(h.backstroke.l1, h.pool)}));

  const elStroke = document.getElementById('chartStroke');
  if (elStroke && frTrend.some(d=>d.best!=null)) {
    charts['db-stroke']=new Chart(elStroke,{type:'bar',
      data:{
        labels:frTrend.map(d=>d.x),
        datasets:[
          {type:'bar', label:'Free best L1', data:frTrend.map(d=>d.best),
           backgroundColor:'#38bdf888',borderColor:'#38bdf8',borderWidth:1,borderRadius:4},
          {type:'bar', label:'Free avg L1',  data:frTrend.map(d=>d.avg),
           backgroundColor:'#38bdf833',borderColor:'#38bdf866',borderWidth:1,borderRadius:4},
          {type:'line', label:'Back L1 (latest)',
           data:frTrend.map((_,i)=> i===frTrend.length-1 ? (sh.filter(h=>h.backstroke?.l1!=null).length ? normToYards(sh.filter(h=>h.backstroke?.l1!=null).slice(-1)[0].backstroke.l1, sh.filter(h=>h.backstroke?.l1!=null).slice(-1)[0].pool) : null) : null),
           borderColor:'#818cf8',backgroundColor:'#818cf888',
           pointRadius:6,pointBackgroundColor:'#818cf8',borderWidth:2,spanGaps:false},
        ]
      },
      options:{...cDef,
        plugins:{...cDef.plugins,
          legend:{display:true,labels:{color:'#8b949e',font:{size:9},boxWidth:10}},
          tooltip:{...cDef.plugins.tooltip,callbacks:{
            label:ctx=>`${ctx.dataset.label}: ${ctx.raw!=null?ctx.raw+' strokes':'no data'}`
          }}
        },
        scales:{...cDef.scales,
          y:{...cDef.scales.y,
            title:{display:true,text:'Strokes / 25y (lower = better)',color:'#8b949e',font:{size:9}},
            suggestedMin:18, suggestedMax:32
          }
        }
      }
    });
  } else if (elStroke) {
    elStroke.parentElement.insertAdjacentHTML('beforeend',
      '<p style="color:var(--muted);font-size:11px;text-align:center;padding:50px 0">No training data yet</p>');
  }

  // 3. SC best vs 11-12 Jr Champs entry cut (changed from 9-10)
  const scEvts = [
    {key:'fr50', label:'50 Fr', color:'#38bdf8'},{key:'fr100',label:'100 Fr',color:'#0ea5e9'},
    {key:'bk50', label:'50 Bk', color:'#818cf8'},{key:'bk100',label:'100 Bk',color:'#6366f1'},
    {key:'br50', label:'50 Br', color:'#22c55e'},{key:'br100',label:'100 Br',color:'#16a34a'},
    {key:'fl50', label:'50 Fly',color:'#fb923c'},{key:'im200',label:'200 IM',color:'#ec4899'},
  ].map(e=>({...e,
    best: toSec((DB.scBests||{})[e.key]?.time),
    bot:  toSec(SC11_BOT[e.key]),   // 11-12 bottom cut
    top:  toSec(SC11_TOP[e.key]),   // 11-12 top cut
  }));
  const elSC = document.getElementById('chartSCBest');
  if (elSC) {
    charts['db-scbest']=new Chart(elSC,{type:'bar',
      data:{labels:scEvts.map(e=>e.label),datasets:[
        {label:'SC Best',data:scEvts.map(e=>e.best),borderRadius:4,borderWidth:2,
         backgroundColor:scEvts.map(e=>!e.best?'transparent':e.top&&e.best<=e.top?'#818cf888':e.bot&&e.best<=e.bot?'#3fb95088':'#e3b34188'),
         borderColor:scEvts.map(e=>!e.best?'transparent':e.top&&e.best<=e.top?'#818cf8':e.bot&&e.best<=e.bot?'#3fb950':'#e3b341')},
        {label:'11-12 Entry cut',data:scEvts.map(e=>e.bot),borderRadius:4,borderWidth:1,
         backgroundColor:'#58a6ff11',borderColor:'#58a6ff66'},
      ]},
      options:{...cDef,
        plugins:{...cDef.plugins,legend:{display:true,labels:{color:'#8b949e',font:{size:9},boxWidth:10}},
          tooltip:{...cDef.plugins.tooltip,callbacks:{label:ctx=>ctx.datasetIndex===0?'SC Best: '+fmtSec(ctx.raw):'11-12 Entry: '+fmtSec(ctx.raw)}}},
        scales:{...cDef.scales,y:{...cDef.scales.y,ticks:{...cDef.scales.y.ticks,callback:v=>fmtSec(v)},
          title:{display:true,text:'Time (lower = faster)',color:'#8b949e',font:{size:9}}}}
      }
    });
  }

  // 4. Meet timeline — separate SC and LC, per event
  // Build a timeline that shows SC and LC as distinct datasets so mixing doesn't occur
  const trackEvts = [
    {ev:'100 Free', scCol:'#38bdf8', lcCol:'#0ea5e9'},
    {ev:'100 Back', scCol:'#818cf8', lcCol:'#6366f1'},
    {ev:'50 Free',  scCol:'#fb923c', lcCol:'#ea580c'},
  ];
  const scMeets = [...meets].filter(m=>m.pool==='25y'||m.pool==='25m').sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const lcMeets = [...meets].filter(m=>m.pool==='50m').sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  // Use a combined sorted date list so both series share the same x-axis
  const allDates = [...new Set([...scMeets,...lcMeets].map(m=>m.date))].sort();

  const elMeet = document.getElementById('chartMeetTime');
  if (elMeet) {
    if (allDates.length) {
      const datasets = [];
      trackEvts.forEach(({ev,scCol,lcCol})=>{
        // SC dataset
        const scData = allDates.map(d=>{
          const m=scMeets.filter(x=>x.date===d&&x.event===ev);
          return m.length?Math.min(...m.map(x=>toSec(x.time)).filter(Boolean)):null;
        });
        if (scData.some(v=>v!=null)) datasets.push({
          label:`${ev} (SC)`,borderColor:scCol,backgroundColor:scCol+'33',
          borderWidth:2,pointRadius:5,pointStyle:'circle',pointBackgroundColor:scCol,
          tension:.3,spanGaps:false,data:scData,borderDash:[]
        });
        // LC dataset — dashed line to visually distinguish
        const lcData = allDates.map(d=>{
          const m=lcMeets.filter(x=>x.date===d&&x.event===ev);
          return m.length?Math.min(...m.map(x=>toSec(x.time)).filter(Boolean)):null;
        });
        if (lcData.some(v=>v!=null)) datasets.push({
          label:`${ev} (LC)`,borderColor:lcCol,backgroundColor:lcCol+'22',
          borderWidth:2,pointRadius:5,pointStyle:'triangle',pointBackgroundColor:lcCol,
          tension:.3,spanGaps:false,data:lcData,borderDash:[5,3]
        });
      });
      charts['db-meet']=new Chart(elMeet,{type:'line',
        data:{labels:allDates,datasets},
        options:{...cDef,
          plugins:{...cDef.plugins,
            legend:{display:true,labels:{color:'#8b949e',font:{size:9},boxWidth:12,
              generateLabels:chart=>chart.data.datasets.map((ds,i)=>({
                text:ds.label, fillStyle:ds.borderColor, strokeStyle:ds.borderColor,
                lineWidth:2, hidden:false, datasetIndex:i,
                lineDash: ds.borderDash||[]
              }))}},
            tooltip:{...cDef.plugins.tooltip,callbacks:{
              label:ctx=>ctx.raw!=null?`${ctx.dataset.label}: ${fmtSec(ctx.raw)}`:'No data',
              afterLabel:ctx=>ctx.dataset.label.includes('LC')?'● Long course (50m)':'○ Short course'
            }}
          },
          scales:{...cDef.scales,y:{...cDef.scales.y,reverse:true,
            ticks:{...cDef.scales.y.ticks,callback:v=>fmtSec(v)},
            title:{display:true,text:'Time · lower = faster · ○ SC · ● LC',color:'#8b949e',font:{size:9}}}}
        }
      });
    } else {
      elMeet.parentElement.insertAdjacentHTML('beforeend',
        '<p style="color:var(--muted);font-size:11px;text-align:center;padding:50px 0">No meet results yet — add in Meet Results tab</p>');
    }
  }
}

// ── PREDICTION FIGURE ─────────────────────────────────────────────────────────
function renderPredFigure() {
  const pf = document.getElementById('pred-figure');
  if (!pf) return;

  const predEvts = [
    {key:'fr50', label:'50 Free',    color:'#38bdf8', factor:SC_TO_LC.fr50},
    {key:'fr100',label:'100 Free',   color:'#0ea5e9', factor:SC_TO_LC.fr100},
    {key:'bk50', label:'50 Back',    color:'#818cf8', factor:SC_TO_LC.bk50},
    {key:'bk100',label:'100 Back',   color:'#6366f1', factor:SC_TO_LC.bk100},
    {key:'br50', label:'50 Breast',  color:'#22c55e', factor:SC_TO_LC.br50},
    {key:'br100',label:'100 Breast', color:'#16a34a', factor:SC_TO_LC.br100},
    {key:'fl50', label:'50 Fly',     color:'#fb923c', factor:SC_TO_LC.fl50},
    {key:'im200',label:'200 IM',     color:'#ec4899', factor:SC_TO_LC.im200},
  ];

  // ── Helpers ──────────────────────────────────────────────────────────────────
  const sPill = (text, color) =>
    `<span style="background:${color}22;color:${color};border:1px solid ${color}44;
      border-radius:20px;padding:1px 9px;font-size:10px;font-weight:700;
      font-family:var(--mono);white-space:nowrap">${text}</span>`;

  // Status against a dual-band (top cut / bottom cut)
  const bandStat = (sec, topSec, botSec) => {
    if (!sec||!topSec||!botSec) return null;
    if (sec<=topSec) return {text:'Exceeds Sr cut',color:'#818cf8'};
    if (sec<=botSec) return {text:'✓ Qualifies',color:'#3fb950'};
    return {text:`+${(sec-botSec).toFixed(2)}s`,color:'#e3b341'};
  };

  // Mini qualifying bar
  const miniBar = (dotSec, adjSec, actSec, topSec, botSec, topLabel, botLabel) => {
    if (!topSec||!botSec) return '';
    const lo=topSec*0.93, hi=botSec*1.07, range=hi-lo;
    const p=s=>s!=null?Math.max(0,Math.min(100,((s-lo)/range)*100)):null;
    const pTop=p(topSec), pBot=p(botSec);
    const pDot=p(dotSec), pAdj=p(adjSec), pAct=p(actSec);
    const dc=!dotSec?'#8b949e':dotSec<=topSec?'#818cf8':dotSec<=botSec?'#3fb950':'#e3b341';
    return `
      <div style="margin:8px 0">
        <div style="height:10px;background:#21262d;border-radius:3px;position:relative;margin-bottom:3px">
          <div style="position:absolute;top:0;bottom:0;left:${pTop}%;width:${pBot-pTop}%;
            background:#3fb95033;border-left:2px solid #3fb95066;border-right:2px solid #3fb95066"></div>
          ${pDot!=null?`<div style="position:absolute;top:50%;left:${pDot}%;transform:translate(-50%,-50%);
            width:10px;height:10px;background:${dc};border-radius:50%;border:2px solid #06080f;z-index:3"
            title="Predicted: ${fmtSec(dotSec)}"></div>`:''}
          ${pAdj!=null?`<div style="position:absolute;top:50%;left:${pAdj}%;transform:translate(-50%,-50%);
            width:8px;height:8px;background:${dc}88;border-radius:50%;border:1px solid #06080f;z-index:2"
            title="Adjusted: ${fmtSec(adjSec)}"></div>`:''}
          ${pAct!=null?`<div style="position:absolute;top:50%;left:${pAct}%;transform:translate(-50%,-50%);
            width:10px;height:10px;background:#e3b341;border-radius:50%;border:2px solid #06080f;z-index:4"
            title="Actual: ${fmtSec(actSec)}"></div>`:''}
        </div>
        <div style="display:flex;justify-content:space-between">
          <span style="font-size:8px;color:#818cf8;font-family:var(--mono)">${topLabel} →</span>
          <span style="font-size:8px;color:#58a6ff;font-family:var(--mono)">← ${botLabel}</span>
        </div>
      </div>`;
  };

  // ── SC→LC conversion prediction (used for both July LC 9-10 and 11-12) ──────
  const lcCard = (ev, topBand, botBand, ageLabel, accentColor) => {
    const scRec=(DB.scBests||{})[ev.key];
    const lcRec=(DB.lcBests||{})[ev.key];
    const scSec=toSec(scRec?.time);
    const predSec=scSec?scSec*ev.factor:null;
    const adjSec=predSec?predSec+2.5:null;
    const actSec=toSec(lcRec?.time);
    const top=toSec(topBand[ev.key]), bot=toSec(botBand[ev.key]);
    const qs=bandStat(predSec,top,bot);
    const qsAdj=bandStat(adjSec,top,bot);
    const qsAct=actSec?bandStat(actSec,top,bot):null;
    return `
      <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;
        padding:12px;border-left:4px solid ${ev.color}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:4px">
          <span style="font-size:12px;font-weight:800;color:${ev.color};font-family:var(--mono)">${ev.label}</span>
          <span style="font-size:9px;color:var(--muted);font-family:var(--mono)">×${ev.factor.toFixed(3)}</span>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px;margin-bottom:4px">
          <div><div style="font-size:8px;color:var(--muted);font-family:var(--mono)">SC Best</div>
            <div style="font-size:13px;font-weight:800;color:var(--text)">${scRec?.time||'—'}</div></div>
          <div><div style="font-size:8px;color:var(--muted);font-family:var(--mono)">Predicted LC</div>
            <div style="font-size:13px;font-weight:800;color:${ev.color}">${predSec?fmtSec(predSec):'—'}</div></div>
          <div><div style="font-size:8px;color:var(--muted);font-family:var(--mono)">Adj (+2.5s)</div>
            <div style="font-size:12px;font-weight:700;color:var(--muted)">${adjSec?fmtSec(adjSec):'—'}</div></div>
          <div><div style="font-size:8px;color:var(--muted);font-family:var(--mono)">LC Actual</div>
            <div style="font-size:13px;font-weight:800;color:var(--gold)">${lcRec?.time||'—'}</div></div>
        </div>
        ${top&&bot?miniBar(predSec,adjSec,actSec,top,bot,topBand[ev.key],botBand[ev.key]):''}
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:4px">
          ${qs?sPill(qs.text,qs.color):''}
          ${qsAdj&&qsAdj.text!==qs?.text?`<span style="font-size:9px;color:var(--muted)">adj:</span>${sPill(qsAdj.text,qsAdj.color)}`:''}
          ${qsAct?`<span style="font-size:9px;color:var(--gold)">actual:</span>${sPill(qsAct.text,qsAct.color)}`:''}
        </div>
      </div>`;
  };

  // ── SC improvement prediction for March (9 months away) ─────────────────────
  // Strategy: apply an age-group typical improvement rate for 11-year-old girls
  // over ~9 months of consistent training. Conservative/target/stretch bands.
  // Based on observed improvement trajectory from this athlete's data.
  const SC_IMPROVE_RATES = {
    // Event-specific improvement rates over 9 months (fraction reduction from current best)
    // Conservative = 2%, Target = 4%, Stretch = 6%
    // Sprint events (50s) tend to improve faster with technique work
    // Longer events benefit more from aerobic base
    fr50:  {cons:0.030, tgt:0.050, str:0.075},
    fr100: {cons:0.025, tgt:0.045, str:0.070},
    fr200: {cons:0.020, tgt:0.040, str:0.065},
    bk50:  {cons:0.035, tgt:0.055, str:0.080},
    bk100: {cons:0.030, tgt:0.050, str:0.075},
    br50:  {cons:0.030, tgt:0.050, str:0.075},
    br100: {cons:0.025, tgt:0.045, str:0.070},
    fl50:  {cons:0.035, tgt:0.060, str:0.085},
    fl100: {cons:0.030, tgt:0.055, str:0.080},
    im200: {cons:0.025, tgt:0.045, str:0.070},
  };

  const scMarchCard = (ev) => {
    const scRec=(DB.scBests||{})[ev.key];
    const scSec=toSec(scRec?.time);
    const rate=SC_IMPROVE_RATES[ev.key]||{cons:0.025,tgt:0.045,str:0.070};
    const cons=scSec?fmtSec(scSec*(1-rate.cons)):null;
    const tgt =scSec?fmtSec(scSec*(1-rate.tgt)):null;
    const str =scSec?fmtSec(scSec*(1-rate.str)):null;
    const consSec=scSec?scSec*(1-rate.cons):null;
    const tgtSec =scSec?scSec*(1-rate.tgt):null;
    const strSec =scSec?scSec*(1-rate.str):null;
    const top11=toSec(SC11_TOP[ev.key]), bot11=toSec(SC11_BOT[ev.key]);
    const qsCons=bandStat(consSec,top11,bot11);
    const qsTgt =bandStat(tgtSec, top11,bot11);
    const qsStr =bandStat(strSec, top11,bot11);
    return `
      <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;
        padding:12px;border-left:4px solid ${ev.color}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:4px">
          <span style="font-size:12px;font-weight:800;color:${ev.color};font-family:var(--mono)">${ev.label}</span>
          <span style="font-size:9px;color:var(--muted);font-family:var(--mono)">from ${scRec?.time||'—'}</span>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:6px">
          <div style="background:#1a1f2e;border-radius:6px;padding:6px;text-align:center">
            <div style="font-size:8px;color:var(--muted);font-family:var(--mono);margin-bottom:2px">Conservative</div>
            <div style="font-size:14px;font-weight:800;color:var(--muted)">${cons||'—'}</div>
            <div style="font-size:8px;color:var(--muted)">−${(rate.cons*100).toFixed(0)}%</div>
          </div>
          <div style="background:#1a1f2e;border-radius:6px;padding:6px;text-align:center;border:1px solid ${ev.color}44">
            <div style="font-size:8px;color:${ev.color};font-family:var(--mono);margin-bottom:2px;font-weight:700">Target</div>
            <div style="font-size:14px;font-weight:800;color:${ev.color}">${tgt||'—'}</div>
            <div style="font-size:8px;color:var(--muted)">−${(rate.tgt*100).toFixed(0)}%</div>
          </div>
          <div style="background:#1a1f2e;border-radius:6px;padding:6px;text-align:center">
            <div style="font-size:8px;color:var(--gold);font-family:var(--mono);margin-bottom:2px">Stretch</div>
            <div style="font-size:14px;font-weight:800;color:var(--gold)">${str||'—'}</div>
            <div style="font-size:8px;color:var(--muted)">−${(rate.str*100).toFixed(0)}%</div>
          </div>
        </div>
        ${top11&&bot11?miniBar(tgtSec,consSec,null,top11,bot11,SC11_TOP[ev.key],SC11_BOT[ev.key]):''}
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:4px">
          ${qsTgt?sPill('Target: '+qsTgt.text,qsTgt.color):''}
          ${qsStr&&qsStr.text!==qsTgt?.text?sPill('Stretch: '+qsStr.text,qsStr.color):''}
        </div>
      </div>`;
  };

  // ── Section wrapper ───────────────────────────────────────────────────────────
  const section = (title, sub, color, content, legend) => `
    <div style="margin-bottom:20px">
      <div style="border-left:4px solid ${color};padding-left:12px;margin-bottom:10px">
        <div style="font-size:13px;font-weight:800;color:${color}">${title}</div>
        <div style="font-size:10px;color:var(--muted);margin-top:2px">${sub}</div>
      </div>
      ${legend?`<div style="background:var(--panel);border-radius:6px;padding:8px 12px;
        border:1px solid var(--border);margin-bottom:10px;font-size:10px;color:var(--muted)">${legend}</div>`:''}
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px">
        ${content}
      </div>
    </div>`;

  const lcLegend = `<b style="color:var(--orange)">SC Best × conversion factor</b> = Predicted LC.
    <b>Adj (+2.5s)</b> = realistic first-meet estimate.
    <b style="color:var(--gold)">● Yellow dot</b> = actual LC time once entered.
    <b style="color:var(--green)">Green zone</b> = qualifying window.`;

  const scLegend = `<b>Conservative/Target/Stretch</b> = projected SC improvement over 9 months at 3 / 4.5 / 7% improvement rates.
    Rates based on observed improvement trajectory and typical 11-year-old development.
    <b>Dot</b> = target prediction vs 11-12 SC qualifying window.`;

  pf.innerHTML = `
    ${section(
      '🌊 July LC Jr Champs — 9-10 Age Group (2.5 months)',
      'SC best × SCY→LCM conversion · compared against 9-10 LC Jr Champs qualifying window',
      '#2dd4bf',
      predEvts.map(ev=>LC10_TOP[ev.key]?lcCard(ev,LC10_TOP,LC10_BOT,'9-10','#2dd4bf'):'').join(''),
      lcLegend
    )}
    ${section(
      '🌊 July LC Jr Champs — 11-12 Age Group (2.5 months)',
      'Same SC conversion · compared against 11-12 LC Jr Champs qualifying window',
      '#38bdf8',
      predEvts.map(ev=>LC11_TOP[ev.key]?lcCard(ev,LC11_TOP,LC11_BOT,'11-12','#38bdf8'):'').join(''),
      ''
    )}
    ${section(
      '📏 March SC Jr Champs — 11-12 Age Group (9 months)',
      'Projected SC improvement from current bests over 9 months training · compared against 11-12 SC Jr Champs qualifying window',
      '#bc8cff',
      predEvts.filter(ev=>SC11_TOP[ev.key]).map(ev=>scMarchCard(ev)).join(''),
      scLegend
    )}
  `;
}

function renderQualFigure() {
  const qg = document.getElementById("qual-figure");
  if (!qg) return;

  const qualEvts = [
    {key:"fr50", label:"50 Free",    color:"#38bdf8"},
    {key:"fr100",label:"100 Free",   color:"#0ea5e9"},
    {key:"bk50", label:"50 Back",    color:"#818cf8"},
    {key:"bk100",label:"100 Back",   color:"#6366f1"},
    {key:"br50", label:"50 Breast",  color:"#22c55e"},
    {key:"br100",label:"100 Breast", color:"#16a34a"},
    {key:"fl50", label:"50 Fly",     color:"#fb923c"},
    {key:"im200",label:"200 IM",     color:"#ec4899"},
  ];

  const bandStat = (sec, topSec, botSec) => {
    if (!sec||!topSec||!botSec) return null;
    if (sec <= topSec) return {text:"Exceeds Sr cut — Senior/14U level", color:"#818cf8", icon:"🏅"};
    if (sec <= botSec) return {text:"✓ Qualifies for 11-12 Jr Champs",   color:"#3fb950", icon:"✅"};
    return {text:"Need "+(sec-botSec).toFixed(2)+"s faster to qualify",  color:"#e3b341", icon:"⏱️"};
  };

  const qualBar = (sec, top11, bot11, topLabel, botLabel) => {
    if (!top11||!bot11) return "";
    const lo=top11*0.96, hi=bot11*1.06, range=hi-lo;
    const p=s=>s!=null?Math.max(0,Math.min(100,((s-lo)/range)*100)):null;
    const pTop=p(top11), pBot=p(bot11), pSec=p(sec);
    const dc=!sec?"#8b949e":sec<=top11?"#818cf8":sec<=bot11?"#3fb950":"#e3b341";
    const gapLine=sec&&sec>bot11?`<div style="position:absolute;top:50%;left:${pBot}%;right:${100-pSec}%;height:2px;background:#e3b34166;transform:translateY(-50%);z-index:1"></div>`:"";
    return `
      <div style="margin:10px 0 4px">
        <div style="position:relative;height:16px;margin-bottom:2px">
          <span style="position:absolute;left:${pTop}%;transform:translateX(-50%);font-size:9px;color:#818cf8;font-family:var(--mono);white-space:nowrap">← Sr cut ${topLabel}</span>
          <span style="position:absolute;left:${pBot}%;transform:translateX(-50%);font-size:9px;color:#3fb950;font-family:var(--mono);white-space:nowrap">Entry ${botLabel} →</span>
        </div>
        <div style="height:20px;background:#161b22;border-radius:5px;position:relative;border:1px solid #21262d;overflow:visible">
          <div style="position:absolute;top:0;bottom:0;left:0;width:${pTop}%;background:#21262d88;border-radius:5px 0 0 5px"></div>
          <div style="position:absolute;top:0;bottom:0;left:${pBot}%;right:0;background:#21262d88;border-radius:0 5px 5px 0"></div>
          <div style="position:absolute;top:0;bottom:0;left:${pTop}%;width:${pBot-pTop}%;background:linear-gradient(90deg,#3fb95044,#3fb95022);border-left:3px solid #3fb950;border-right:3px solid #3fb950aa">
            <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8px;color:#3fb95088;font-family:var(--mono);font-weight:700;letter-spacing:.5px">QUALIFYING WINDOW</div>
          </div>
          ${gapLine}
          ${pSec!=null?`<div style="position:absolute;top:50%;left:${pSec}%;transform:translate(-50%,-50%);z-index:10"><div style="width:16px;height:16px;background:${dc};border-radius:50%;border:3px solid #06080f;box-shadow:0 0 8px ${dc}cc"></div></div>`:""}
        </div>
        ${pSec!=null&&sec?`<div style="position:relative;height:14px;margin-top:2px"><span style="position:absolute;left:${pSec}%;transform:translateX(-50%);font-size:9px;font-weight:800;color:${dc};font-family:var(--mono)">${fmtSec(sec)}</span></div>`:""}
      </div>`;
  };

  const eventCard = ev => {
    const sc=(DB.scBests||{})[ev.key]?.time, scS=toSec(sc);
    const lc=(DB.lcBests||{})[ev.key]?.time, lcS=toSec(lc);
    const sc11t=toSec(SC11_TOP[ev.key]), sc11b=toSec(SC11_BOT[ev.key]);
    const lc11t=toSec(LC11_TOP[ev.key]), lc11b=toSec(LC11_BOT[ev.key]);
    const scStat=bandStat(scS,sc11t,sc11b);
    const lcStat=bandStat(lcS,lc11t,lc11b);
    const hasSC=sc11t&&sc11b;
    const hasLC=lc11t&&lc11b;
    return `
      <div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;border-left:5px solid ${ev.color}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:6px">
          <span style="font-size:14px;font-weight:800;color:${ev.color};font-family:var(--mono)">${ev.label}</span>
          <div style="display:flex;gap:12px">
            ${sc?`<div style="text-align:right"><div style="font-size:8px;color:var(--muted);font-family:var(--mono)">SC BEST</div><div style="font-size:14px;font-weight:800;color:var(--text)">${sc}</div></div>`:""}
            ${lc?`<div style="text-align:right"><div style="font-size:8px;color:var(--teal);font-family:var(--mono)">LC BEST</div><div style="font-size:14px;font-weight:800;color:var(--teal)">${lc}</div></div>`:""}
          </div>
        </div>
        ${hasSC?`
          <div style="margin-bottom:${hasLC?12:0}px;${hasLC?"padding-bottom:12px;border-bottom:1px solid var(--border)":""}">
            <div style="font-size:9px;font-weight:700;color:var(--accent);text-transform:uppercase;font-family:var(--mono);letter-spacing:.8px;margin-bottom:2px">
              📏 Short Course Yards (SCY) — 11-12 Jr Champs · ${SC11_TOP[ev.key]} – ${SC11_BOT[ev.key]}</div>
            ${qualBar(scS,sc11t,sc11b,SC11_TOP[ev.key],SC11_BOT[ev.key])}
            ${scStat?`<div style="display:flex;align-items:center;gap:8px;margin-top:8px">
              <span style="font-size:14px">${scStat.icon}</span>
              <span style="background:${scStat.color}22;color:${scStat.color};border:1px solid ${scStat.color}55;border-radius:20px;padding:3px 12px;font-size:11px;font-weight:700;font-family:var(--mono)">${scStat.text}</span>
            </div>`:""}
            ${!sc?`<p style="font-size:11px;color:var(--muted);font-style:italic;margin-top:6px">No SC time — enter in Season Bests tab</p>`:""}
          </div>`:""}
        ${hasLC?`
          <div>
            <div style="font-size:9px;font-weight:700;color:var(--teal);text-transform:uppercase;font-family:var(--mono);letter-spacing:.8px;margin-bottom:2px">
              🌊 Long Course Meters (LCM) — 11-12 Jr Champs · ${LC11_TOP[ev.key]||"—"} – ${LC11_BOT[ev.key]||"—"}</div>
            ${qualBar(lcS,lc11t,lc11b,LC11_TOP[ev.key]||"",LC11_BOT[ev.key]||"")}
            ${lcStat?`<div style="display:flex;align-items:center;gap:8px;margin-top:8px">
              <span style="font-size:14px">${lcStat.icon}</span>
              <span style="background:${lcStat.color}22;color:${lcStat.color};border:1px solid ${lcStat.color}55;border-radius:20px;padding:3px 12px;font-size:11px;font-weight:700;font-family:var(--mono)">${lcStat.text}</span>
            </div>`:""}
            ${!lc?`<p style="font-size:11px;color:var(--muted);font-style:italic;margin-top:6px">No LC time yet — add after July meet</p>`:""}
          </div>`:""}
        ${!hasSC&&!hasLC?`<p style="color:var(--muted);font-size:11px">Standards not available</p>`:""}
      </div>`;
  };

  qg.innerHTML = `
    <div style="background:var(--panel);border-radius:8px;padding:12px 16px;border:1px solid var(--border);margin-bottom:16px;display:flex;gap:20px;flex-wrap:wrap;align-items:center">
      <span style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px">Legend:</span>
      ${[["bar","#3fb950","✅ In qualifying window"],["dot","#818cf8","🏅 Exceeds Sr cut"],["dot","#e3b341","⏱️ Outside — gap in seconds shown"],["dot","#8b949e","— No time recorded"]].map(([type,c,t])=>`
        <div style="display:flex;align-items:center;gap:6px">
          ${type==="bar"?`<div style="width:20px;height:10px;background:#3fb95044;border:2px solid #3fb950;border-radius:2px"></div>`:`<div style="width:10px;height:10px;border-radius:50%;background:${c}"></div>`}
          <span style="font-size:10px;color:var(--muted)">${t}</span>
        </div>`).join("")}
      <span style="font-size:10px;color:var(--muted);border-left:1px solid var(--border);padding-left:16px">
        <b style="color:var(--accent)">📏 SC</b> = short course yards &nbsp;|&nbsp; <b style="color:var(--teal)">🌊 LC</b> = long course meters &nbsp;|&nbsp; All 11-12 age group only
      </span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px">
      ${qualEvts.map(ev=>eventCard(ev)).join("")}
    </div>`;
}

function sessionCard(s) {
  const times=(s.reps||[]).map(r=>toSec(r.time)).filter(Boolean);
  const spread=times.length>1?(Math.max(...times)-Math.min(...times)).toFixed(1):null;
  // Detect how many legs this session has
  const numLegs = s.numLegs || Math.max(...(s.reps||[]).map(r=>{
    let n=0; for(let i=1;i<=10;i++){if(r[`l${i}`]!=null)n=i;} return n;
  }), 4);
  const allL1=(s.reps||[]).map(r=>r.l1).filter(v=>v!=null);
  const bestL1=allL1.length?Math.min(...allL1):null;
  const setLabel = s.setType && SET_TYPES[s.setType] ? SET_TYPES[s.setType].label : `${(s.reps||[]).length}×reps`;
  const open=openSessions.has(s.id);

  // Build dynamic leg headers and cells
  const legHeaders = Array.from({length:numLegs},(_,i)=>`<th>L${i+1}</th>`).join('');
  const repRows = (s.reps||[]).map(r=>{
    const vals=Array.from({length:numLegs},(_,i)=>r[`l${i+1}`]).filter(v=>v!=null);
    const sw=vals.length>1?Math.max(...vals)-Math.min(...vals):null;
    const legCells = Array.from({length:numLegs},(_,i)=>{
      const v=r[`l${i+1}`];
      return `<td class="mono" style="color:${strokeColor(v)};font-weight:${strokeWeight(v)}">${v??'—'}</td>`;
    }).join('');
    return `<tr>
      <td class="mono" style="color:var(--accent);font-weight:700">R${r.rep}</td>
      <td class="mono" style="color:${timeColor(r.time)};font-weight:800;font-size:13px">${r.time||'—'}</td>
      ${legCells}
      <td class="mono" style="color:${sw!=null?swingColor(sw):'var(--muted)'};font-weight:700">${sw??'—'}</td>
      <td style="font-size:10px;color:var(--muted)">${esc(r.notes||'')}</td>
    </tr>`;
  }).join('');

  return `
    <div class="session-item">
      <div class="session-hdr" onclick="toggleSession(${s.id})">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <span style="font-size:14px;font-weight:800;color:var(--accent)">Session ${s.id}</span>
          ${pill(s.date,'#8b949e')}
          ${pill(s.pool.toUpperCase(),s.pool.includes('m')&&!s.pool.includes('y')?'#e3b341':'#58a6ff')}
          ${pill(setLabel,'#bc8cff')}
          ${pill(s.interval,s.interval.includes('error')?'#f85149':'#39d353')}
          ${!s.goggles?pill('No goggles','#e3b341'):''}
          ${spread!=null?pill(`Spread: ${spread}s`,parseFloat(spread)<=2?'#3fb950':parseFloat(spread)<=4?'#e3b341':'#f85149'):''}
          ${bestL1!=null?pill(`Best L1: ${bestL1}`,bestL1<=23?'#3fb950':'#e3b341'):''}
          ${s.effortRating!=null?pill(`Effort: ${s.effortRating}/10`,s.effortRating<=5?'#3fb950':'#e3b341'):''}
        </div>
        <div style="display:flex;gap:6px;align-items:center">
          <button class="btn btn-primary btn-sm" onclick="event.stopPropagation();editSession(${s.id})">Edit</button>
          <button class="btn btn-red btn-sm" onclick="event.stopPropagation();deleteSession(${s.id})">Delete</button>
          <span style="color:var(--muted);font-size:12px">${open?'▲':'▼'}</span>
        </div>
      </div>
      <div class="session-body ${open?'open':''}">
        ${s.notes?`<p style="font-size:11px;color:var(--muted);margin-bottom:12px;font-family:var(--mono)">${esc(s.notes)}</p>`:''}
        <div style="overflow-x:auto">
          <table class="tbl">
            <thead><tr><th>Rep</th><th>Time</th>${legHeaders}<th>Swing</th><th>Notes</th></tr></thead>
            <tbody>${repRows}</tbody>
          </table>
        </div>
        ${(s.postSet||[]).length?`
          <div style="margin-top:12px">
            <div style="font-size:10px;color:var(--green);font-weight:700;margin-bottom:6px;font-family:var(--mono)">POST-SET TIME TRIALS</div>
            ${s.postSet.map(p=>`
              <div style="background:var(--green)11;border:1px solid var(--green)33;border-radius:6px;padding:6px 12px;margin-bottom:6px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
                <span style="color:var(--green);font-weight:700;font-size:12px;font-family:var(--mono)">${esc(p.label)}</span>
                ${pill(p.time,'#3fb950')}
                <span style="color:var(--muted);font-size:10px;font-family:var(--mono)">${[p.l1,p.l2,p.l3,p.l4].filter(v=>v!=null).join(' / ')} strokes</span>
                ${p.notes?`<span style="font-size:10px;color:var(--muted)">${esc(p.notes)}</span>`:''}
              </div>`).join('')}
          </div>`:''}
        ${s.effortRating!=null||s.could2More?`
          <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
            ${s.effortRating!=null?pill(`Effort: ${s.effortRating}/10`,s.effortRating<=5?'#3fb950':s.effortRating<=7?'#e3b341':'#f85149'):''}
            ${s.could2More?pill(`2 more: ${s.could2More}`,s.could2More==='yes'?'#3fb950':s.could2More==='maybe'?'#e3b341':'#f85149'):''}
          </div>`:''}
      </div>
    </div>`;
}
function toggleSession(id) {
  if(openSessions.has(id))openSessions.delete(id);else openSessions.add(id);
  renderSessions();
}
function deleteSession(id) {
  if(!confirm('Delete this session?'))return;
  DB.sessions=(DB.sessions||[]).filter(s=>s.id!==id);
  saveData(); renderSessions(); toast('Session deleted');
}

// MEETS
// ═══════════════════════════════════════════════════════════════
// ── Meet sort state ───────────────────────────────────────────────────────────
let meetSortCol = 'date';
let meetSortDir = 'desc'; // 'asc' or 'desc'

function sortMeets(col) {
  if (meetSortCol === col) {
    meetSortDir = meetSortDir === 'asc' ? 'desc' : 'asc';
  } else {
    meetSortCol = col;
    meetSortDir = col === 'date' ? 'desc' : 'asc';
  }
  renderMeets();
}

function renderMeets() {
  let meets = [...(DB.meetResults||[])];

  // Sort
  meets.sort((a,b)=>{
    let va, vb;
    if (meetSortCol==='date')  { va=a.date||'';   vb=b.date||''; }
    else if (meetSortCol==='event') { va=a.event||'';  vb=b.event||''; }
    else if (meetSortCol==='pool')  { va=a.pool||'';   vb=b.pool||''; }
    else if (meetSortCol==='time')  { va=toSec(a.time)||Infinity; vb=toSec(b.time)||Infinity; }
    else if (meetSortCol==='meet')  { va=a.meet||'';   vb=b.meet||''; }
    else { va=a[meetSortCol]||''; vb=b[meetSortCol]||''; }
    const cmp = typeof va==='number' ? va-vb : String(va).localeCompare(String(vb));
    return meetSortDir==='asc' ? cmp : -cmp;
  });

  const arrow = col => meetSortCol===col ? (meetSortDir==='asc'?'▲':'▼') : '⇅';
  const thStyle = `padding:9px 10px;font-size:9px;color:var(--muted);text-transform:uppercase;
    border-bottom:1px solid var(--border);font-family:var(--mono);white-space:nowrap;
    cursor:pointer;user-select:none;`;
  const thActive = `color:var(--accent);`;

  document.getElementById('tab-meets').innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px">
      <div>
        <h2 style="font-size:22px;font-weight:800">Meet Results</h2>
        <p style="color:var(--muted);font-size:12px;margin-top:4px">${meets.length} results · click column headers to sort</p>
      </div>
      <button class="btn btn-purple" onclick="openMeetModal()">+ Add Result</button>
    </div>
    <div style="overflow-x:auto">
      <table class="tbl">
        <thead><tr>
          <th style="${thStyle}${meetSortCol==='date'?thActive:''}" onclick="sortMeets('date')">Date ${arrow('date')}</th>
          <th style="${thStyle}${meetSortCol==='meet'?thActive:''}" onclick="sortMeets('meet')">Meet ${arrow('meet')}</th>

// ── Auto PR detection ──────────────────────────────────────────────────────────
// For each event, sort results by date, then mark the PR as the best time
// seen so far chronologically. Re-runs every time meet data changes.
function recomputeAllPRs() {
  const results = DB.meetResults || [];
  // Group by event
  const byEvent = {};
  results.forEach(m => {
    const key = m.event;
    if (!byEvent[key]) byEvent[key] = [];
    byEvent[key].push(m);
  });
  // For each event, sort chronologically and mark PRs
  Object.values(byEvent).forEach(group => {
    group.sort((a,b) => (a.date||'').localeCompare(b.date||''));
    let best = Infinity;
    group.forEach(m => {
      const t = toSec(m.time);
      if (t !== null && t < best) {
        best = t;
        m.pr = true;
      } else {
        m.pr = false;
      }
    });
  });
}

function updateSession(id) {
  const idx = (DB.sessions||[]).findIndex(x=>x.id===id);
  if (idx===-1) return;
  const numReps = (DB.sessions[idx].reps||[]).length || 6;
  const reps = Array.from({length:numReps},(_,i)=>{
    const time = document.getElementById(`r${i}-time`)?.value.trim();
    if (!time) return null;
    return {
      rep:i+1, time,
      l1:parseInt(document.getElementById(`r${i}-l1`)?.value)||null,
      l2:parseInt(document.getElementById(`r${i}-l2`)?.value)||null,
      l3:parseInt(document.getElementById(`r${i}-l3`)?.value)||null,
      l4:parseInt(document.getElementById(`r${i}-l4`)?.value)||null,
      notes:document.getElementById(`r${i}-note`)?.value.trim()||'',
    };
  }).filter(Boolean);

  // Collect postSet — handle both existing and new
  const existingPS = DB.sessions[idx].postSet||[];
  const numPS = Math.max(existingPS.length, 2);
  const postSet = Array.from({length:numPS},(_,i)=>{
    const time = document.getElementById(`ps${i}-time`)?.value.trim();
    if (!time) return null;
    return {
      label:document.getElementById(`ps${i}-label`)?.value.trim()||'',
      time,
      l1:parseInt(document.getElementById(`ps${i}-l1`)?.value)||null,
      l2:parseInt(document.getElementById(`ps${i}-l2`)?.value)||null,
      l3:parseInt(document.getElementById(`ps${i}-l3`)?.value)||null,
      l4:parseInt(document.getElementById(`ps${i}-l4`)?.value)||null,
      notes:'',
    };
  }).filter(Boolean);

  const effort = document.getElementById('s-effort')?.value;
  DB.sessions[idx] = {
    ...DB.sessions[idx],
    date:document.getElementById('s-date').value,
    pool:document.getElementById('s-pool').value,
    interval:document.getElementById('s-interval').value.trim(),
    notes:document.getElementById('s-notes').value.trim(),
    goggles:document.getElementById('s-goggles').value==='yes',
    reps, postSet,
    effortRating:effort?parseInt(effort):null,
    could2More:document.getElementById('s-2more').value||null,
  };
  saveData(); closeModal(); renderSessions(); toast('Session updated ✓');
}

// AUTO PR DETECTION
// ═══════════════════════════════════════════════════════════════
// Returns true if newTime is faster than all previous results for same event (excluding editId)
function isNewPR(event, pool, newTime, excludeId=null) {
  const newSec = toSec(newTime);
  if (!newSec) return false;
  const prev = (DB.meetResults||[]).filter(m =>
    m.event.toLowerCase().trim() === event.toLowerCase().trim() &&
    m.pool === pool &&
    m.id !== excludeId &&
    m.time
  );
  if (!prev.length) return true; // First time in this event = PR
  const bestPrev = Math.min(...prev.map(m => toSec(m.time)).filter(Boolean));
  return newSec < bestPrev;
}

function buildRepRows(numReps, numLegs, existingReps=[]) {
  const legHeaders = Array.from({length:numLegs},(_,i)=>
    `<th style="padding:4px 5px;font-size:9px;color:var(--muted);font-family:var(--mono)">L${i+1}</th>`
  ).join('');
  const rows = Array.from({length:numReps},(_,i)=>{
    const r = existingReps[i] || {};
    const legInputs = Array.from({length:numLegs},(_,li)=>{
      const key = `l${li+1}`;
      const val = r[key]!=null ? r[key] : '';
      return `<td style="padding:3px 3px"><input class="form-input-sm rep-inp" id="r${i}-l${li+1}" value="${val}" placeholder="—" style="width:42px"></td>`;
    }).join('');
    return `<tr>
      <td class="mono" style="color:var(--accent);font-weight:700;padding:4px 6px">R${i+1}</td>
      <td style="padding:3px 3px"><input class="form-input-sm rep-inp-time" id="r${i}-time" value="${esc(r.time||'')}" placeholder="2:34" style="width:62px;font-family:var(--mono);background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:4px 5px;font-size:11px;color:var(--text)"></td>
      ${legInputs}
      <td style="padding:3px 3px"><input class="form-input-sm rep-inp-note form-input" id="r${i}-note" value="${esc(r.notes||'')}" placeholder="notes" style="width:110px"></td>
    </tr>`;
  }).join('');
  return { headers: legHeaders, rows };
}

function rebuildRepTable() {
  const typeKey = document.getElementById('s-settype')?.value;
  const isCustom = typeKey === 'custom';
  document.getElementById('s-custom-reps-group').style.display = isCustom ? '' : 'none';
  document.getElementById('s-custom-legs-group').style.display = isCustom ? '' : 'none';

  let numReps, numLegs;
  if (isCustom) {
    numReps = parseInt(document.getElementById('s-custom-reps')?.value) || 6;
    numLegs = parseInt(document.getElementById('s-custom-legs')?.value) || 4;
  } else {
    const st = SET_TYPES[typeKey] || SET_TYPES['4x150'];
    numReps = st.reps;
    numLegs = st.legs;
    // Auto-set interval suggestion
    const intervalSuggestions = {'6x100':'2:30','4x150':'3:45','5x150':'3:45','4x200':'5:00','5x200':'5:00','8x75':'1:45','10x50':'1:15'};
    if (intervalSuggestions[typeKey]) {
      const intEl = document.getElementById('s-interval');
      if (intEl && !intEl.dataset.userEdited) intEl.value = intervalSuggestions[typeKey];
    }
  }

  const { headers, rows } = buildRepRows(numReps, numLegs);
  const hdrRow = document.getElementById('rep-table-headers');
  const body = document.getElementById('rep-table-body');
  if (hdrRow && body) {
    hdrRow.innerHTML = `
      <th style="padding:4px 6px;font-size:9px;color:var(--muted);font-family:var(--mono)">Rep</th>
      <th style="padding:4px 6px;font-size:9px;color:var(--muted);font-family:var(--mono)">Time</th>
      ${headers}
      <th style="padding:4px 6px;font-size:9px;color:var(--muted);font-family:var(--mono)">Notes</th>
    `;
    body.innerHTML = rows;
  }
}

// Mark interval as user-edited so auto-fill doesn't overwrite it
document.addEventListener('input', e => {
  if (e.target?.id === 's-interval') e.target.dataset.userEdited = '1';
});

function saveSession() {
  const typeKey = document.getElementById('s-settype')?.value || 'custom';
  const isCustom = typeKey === 'custom';
  let numReps, numLegs;
  if (isCustom) {
    numReps = parseInt(document.getElementById('s-custom-reps')?.value) || 6;
    numLegs = parseInt(document.getElementById('s-custom-legs')?.value) || 4;
  } else {
    const st = SET_TYPES[typeKey] || SET_TYPES['4x150'];
    numReps = st.reps; numLegs = st.legs;
  }

  const reps = Array.from({length:numReps},(_,i)=>{
    const time = document.getElementById(`r${i}-time`)?.value.trim();
    if (!time) return null;
    const rep = { rep:i+1, time, notes:document.getElementById(`r${i}-note`)?.value.trim()||'' };
    for (let li=1; li<=numLegs; li++) {
      const v = parseInt(document.getElementById(`r${i}-l${li}`)?.value);
      rep[`l${li}`] = isNaN(v) ? null : v;
    }
    return rep;
  }).filter(Boolean);

  const postSet = [0,1].map(i=>{
    const time = document.getElementById(`ps${i}-time`)?.value.trim();
    if (!time) return null;
    return {
      label:document.getElementById(`ps${i}-label`)?.value.trim()||'',
      time,
      l1:parseInt(document.getElementById(`ps${i}-l1`)?.value)||null,
      l2:parseInt(document.getElementById(`ps${i}-l2`)?.value)||null,
      l3:parseInt(document.getElementById(`ps${i}-l3`)?.value)||null,
      l4:parseInt(document.getElementById(`ps${i}-l4`)?.value)||null,
      notes:'',
    };
  }).filter(Boolean);

  const effort = document.getElementById('s-effort')?.value;
  const existingIds = (DB.sessions||[]).map(s=>typeof s.id==='number'?s.id:0);
  const nextId = existingIds.length ? Math.max(...existingIds) + 1 : 1;
  const sess = {
    id: nextId,
    date:document.getElementById('s-date').value,
    pool:document.getElementById('s-pool').value,
    interval:document.getElementById('s-interval').value.trim(),
    setType:typeKey,
    numLegs,
    notes:document.getElementById('s-notes').value.trim(),
    goggles:document.getElementById('s-goggles').value==='yes',
    reps, postSet,
    effortRating:effort?parseInt(effort):null,
    could2More:document.getElementById('s-2more').value||null,
  };
  DB.sessions=[...(DB.sessions||[]),sess];
  saveData(); closeModal(); renderSessions(); toast('Session saved ✓');
}

  const numLegs = getNumLegs(eventDist, pool);
  const wrap = document.getElementById('stroke-inputs-wrap');
  if (!wrap) return;
  const strokes = [
    {prefix:'sc-fr', color:'#38bdf8', label:'🏊 Freestyle'},
    {prefix:'sc-bk', color:'#818cf8', label:'🔄 Backstroke'},
    {prefix:'sc-br', color:'#22c55e', label:'🐸 Breaststroke'},
    {prefix:'sc-fl', color:'#fb923c', label:'🦋 Butterfly'},
  ];
  wrap.innerHTML = strokes.map(s=>buildStrokeInputs(s.prefix, s.color, s.label, numLegs, {})).join('');
}

function collectStrokeData(prefix, numLegs) {
  const gv=(id)=>{const el=document.getElementById(id);return el?el.value.trim():'';};
  const gi=(id)=>{const v=parseInt(gv(id));return isNaN(v)?null:v;};
  const obj = { notes: gv(`${prefix}-notes`) };
  for (let i=1; i<=numLegs; i++) obj[`l${i}`] = gi(`${prefix}-l${i}`);
  return obj;
}

function saveStrokes() {
  const gv=(id)=>{const el=document.getElementById(id);return el?el.value.trim():'';};
  const pool = gv('sc-pool');
  const eventDist = gv('sc-eventdist');
  const numLegs = getNumLegs(eventDist, pool);
  const entry = {
    id:uid(),
    date:gv('sc-date'), pool, eventDist, context:gv('sc-context'), numLegs,
    freestyle:    collectStrokeData('sc-fr', numLegs),
    backstroke:   collectStrokeData('sc-bk', numLegs),
    breaststroke: collectStrokeData('sc-br', numLegs),
    butterfly:    collectStrokeData('sc-fl', numLegs),
    kickCount:{ count:gv('sc-kick-count'), unit:gv('sc-kick-unit'), notes:gv('sc-kick-notes') },
  };
  DB.strokeHistory=[...(DB.strokeHistory||[]),entry];
  saveData(); closeModal(); renderStrokes(); toast('Stroke counts saved ✓');
}

// ═══════════════════════════════════════════════════════════════
// KEYBOARD SHORTCUTS
// ═══════════════════════════════════════════════════════════════
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
});
</script>
